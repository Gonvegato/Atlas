name: Compilar ATLAS. (Android)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    # Para publicar cada versión como «release» (dirección fija del APK, que Familia-Revista descarga y firma).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar la firma provisional (o la de la familia, si hay FIRMA_B64)
        env:
          FIRMA_B64: ${{ secrets.FIRMA_B64 }}
        run: |
          # Opción 1: el secreto FIRMA_B64 de la familia (un .zip o .tar.gz en base64 con familia.keystore y claves.properties)
          if [ -n "$FIRMA_B64" ]; then
            printf '%s' "$FIRMA_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/firma.bin"
            mkdir -p "$RUNNER_TEMP/firma"
            if file -b "$RUNNER_TEMP/firma.bin" | grep -qi zip; then unzip -qo "$RUNNER_TEMP/firma.bin" -d "$RUNNER_TEMP/firma"; else tar -xf "$RUNNER_TEMP/firma.bin" -C "$RUNNER_TEMP/firma"; fi
            KS=$(find "$RUNNER_TEMP/firma" -name familia.keystore | head -n1); PROPS=$(find "$RUNNER_TEMP/firma" -name claves.properties | head -n1)
            if [ -n "$KS" ] && [ -n "$PROPS" ]; then
              PASS=$(grep '^familia.pass=' "$PROPS" | head -n1 | cut -d= -f2- | tr -d '\r'); echo "::add-mask::$PASS"
              { echo "ATLAS_KS=$KS"; echo "ATLAS_KS_PASS=$PASS"; echo "ATLAS_KS_ALIAS=familia"; } >> "$GITHUB_ENV"
              echo "Firma: la de la familia."
              exit 0
            fi
          fi
          # Si no: una clave de usar y tirar. Familia-Revista, que tiene la clave de la familia, la vuelve a firmar.
          PASS="$(openssl rand -hex 16)"; echo "::add-mask::$PASS"
          keytool -genkey -noprompt -keystore "$RUNNER_TEMP/provisional.p12" -storetype PKCS12 -storepass "$PASS" \
            -alias atlas -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ATLAS sin firmar"
          { echo "ATLAS_KS=$RUNNER_TEMP/provisional.p12"; echo "ATLAS_KS_PASS=$PASS"; echo "ATLAS_KS_ALIAS=atlas"; } >> "$GITHUB_ENV"
          echo "::notice::APK con clave provisional (Familia-Revista lo firma con la de la familia)."

      - name: Pruebas
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compilar el APK final
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          "${BT}apksigner" verify --print-certs "$APK" | grep -i "SHA-256" || true
          mkdir -p salida && cp "$APK" salida/ATLAS.apk
          ls -lh salida/ATLAS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-apk
          path: salida/ATLAS.apk
          retention-days: 30

      - name: Publicar la versión (releases/latest/download/ATLAS.apk)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | tr -dc '0-9')
          APK_SHA=$(sha256sum salida/ATLAS.apk | cut -d' ' -f1)
          # sha: el commit de git; apk_sha256: la huella del APK publicado (para comprobar la descarga).
          printf '{"version": "%s", "code": %s, "sha": "%s", "apk_sha256": "%s"}\n' "$VER" "$CODE" "$GITHUB_SHA" "$APK_SHA" > salida/ATLAS.json
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" salida/ATLAS.apk salida/ATLAS.json --clobber
          else
            gh release create "v$VER" salida/ATLAS.apk salida/ATLAS.json --title "ATLAS $VER" --latest \
              --notes "ATLAS $VER (versionCode $CODE). APK con firma provisional: Familia-Revista lo firma con la de la familia y lo sube a Drive."
          fi
